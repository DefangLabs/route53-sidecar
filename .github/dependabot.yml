version: 2

updates:
  # Keep the SHA-pinned action refs in .github/workflows/ current. Without this
  # ecosystem the pins never move: Dependabot's security updates do not cover
  # GitHub Actions, so a stale pin stays stale and silently misses upstream
  # fixes. Dependabot rewrites both the SHA and the trailing "# vX.Y.Z" comment.
  #
  # Patch and minor bumps are approved and merged automatically on green by
  # .github/workflows/dependabot-automerge.yml. Major bumps are left for a human.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR per run instead of one per action, since these land together.
      github-actions:
        patterns:
          - "*"
